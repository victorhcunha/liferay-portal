#
# ==========================================================================
# Target database (where the upgraded portal runs)
# ==========================================================================
#
# Set database.type to one of: mysql, postgresql, sqlserver, mariadb, oracle,
# db2. Then fill in the matching host/username/password block.
#

#database.type=mysql
#database.mysql.host=localhost
#database.mysql.password=
#database.mysql.username=root
#database.mysql.version=8.0

#database.type=postgresql
#database.postgresql.host=localhost
#database.postgresql.password=
#database.postgresql.username=root

#
# ==========================================================================
# Source database (the legacy database to import and upgrade)
# ==========================================================================
#
# Known archive from liferay-qa-portal-legacy-ee
# (the same archives used by upgrade Poshi tests).
#
#portal.legacy.dir=/tmp/liferay-qa-portal-legacy-ee
# - LocalFile.PortalSmokeUpgrade#ViewPortalSmokeArchive625:
#data.archive.type=data-archive-portal
#portal.version=6.2.5

#
# ==========================================================================
# Skip steps not needed for upgrade testing using the upgrade tool
# ==========================================================================
#
skip.start.app.server=true
skip.run.selenium.test=true

#
# ==========================================================================
# Required boilerplate
# ==========================================================================
#
# A non-empty test.class is required so the get-testcase-property macro
# in build-test.xml will read the properties above.
#
test.class=dummy
