#
# ==========================================================================
# Target database (where the upgraded portal runs)
# ==========================================================================
#
# Set database.type to one of: mysql, postgresql, sqlserver, mariadb, oracle,
# db2. Then fill in the matching host/username/password block.
#

#database.type=mysql
#database.mysql.host=localhost
#database.mysql.password=
#database.mysql.username=root
#database.mysql.version=8.0

#database.type=postgresql
#database.postgresql.host=localhost
#database.postgresql.password=
#database.postgresql.username=root

#
# ==========================================================================
# Source database (the legacy database to import and upgrade)
# ==========================================================================
#
# Known archive from liferay-qa-portal-legacy-ee
# (the same archives used by upgrade Poshi tests).
#
#portal.legacy.dir=/tmp/liferay-qa-portal-legacy-ee
# - LocalFile.PortalSmokeUpgrade#ViewPortalSmokeArchive625:
#data.archive.type=data-archive-portal
#portal.version=6.2.5

#
# ==========================================================================
# Upgrade execution
# ==========================================================================
#

# Time budget (seconds) for the upgrade tool to start and finish.
custom.startup.timeout=7200

#
# Extra entries appended to portal-upgrade-ext.properties.
# One property per line, separated by ${line.separator}.
#   - module.framework.properties.osgi.console=    -> disable Gogo so the tool exits cleanly on upgrade failure
#   - virtual.hosts.valid.hosts=...                -> accept this dump's virtual hosts
#   - upgrade.database.dl.storage.check.disabled=  -> skip DL storage check
#   - company.default.web.id=                      -> match the dump's default company
#
custom.upgrade.properties=module.framework.properties.osgi.console=${line.separator}virtual.hosts.valid.hosts=localhost,127.0.0.1,www.able.com${line.separator}upgrade.database.dl.storage.check.disabled=true${line.separator}

# Enable when the dump uses partitioned schema.
#database.partition.enabled=true
#liferay.online.properties=true

#
# ==========================================================================
# Skip steps not needed for upgrade testing using the upgrade tool
# ==========================================================================
#
skip.start.app.server=true
skip.run.selenium.test=true

#
# ==========================================================================
# Run-output archive
# ==========================================================================
#
# Folder where upgrade.log, the upgrade reports, and a copy of this
# properties file are archived after each run. Files are placed under
# <upgrade.output.dir>/<subfolder>/ where <subfolder> is:
#   - the legacy.database.file basename (minus .gz/.zip), or
#   - ${data.archive.type}_${portal.version} when legacy.database.file is unset.
# Filenames are prefixed with yyyyMMdd_HHmm-.
#
upgrade.output.dir=${user.home}/temp/upgrade-runs

#
# ==========================================================================
# JVM options for the upgrade client (optional)
# ==========================================================================
#
# YourKit profiler:
##database.upgrade.client.jvm.opts=-agentpath:/opt/yourkit/bin/linux-x86-64/libyjpagent.so=cpu=tracing,monitors=on,probe_on=*,onexit=snapshot

# Remote debugger (waits for IDE on port 8000):
##database.upgrade.client.jvm.opts=-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=8000

#
# ==========================================================================
# Required boilerplate
# ==========================================================================
#
# A non-empty test.class is required so the get-testcase-property macro
# in build-test.xml will read the properties above.
#
test.class=dummy
